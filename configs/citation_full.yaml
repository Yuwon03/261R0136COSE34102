experiment:
  name: citation-aware-full
  task_type: citation_rag
  seed: 13

data:
  dataset_path: data/combined_ko_train.jsonl
  corpus_path: data/wiki_en_corpus_300k.jsonl
  split: train

model:
  base_model: facebook/nllb-200-distilled-1.3B
  checkpoint_dir: /opt/dlami/nvme/citation_planner/checkpoint
  max_input_length: 256
  max_output_length: 96
  use_mock_model_for_smoke: false
  src_lang: kor_Hang
  tgt_lang: eng_Latn
  lora_enabled: false

training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  retrieval_loss_weight: 0.5
  fp16: true
  gradient_checkpointing: true
  save_each_epoch: true
  output_dir: /opt/dlami/nvme/citation_planner

retriever:
  backend: hybrid-bm25-bge-m3
  top_k: 10

evaluation:
  top_k: 10
  metrics:
    - recall_at_5
    - recall_at_10
    - recall_at_20
    - mrr
    - ndcg_at_10
    - citation_precision
    - citation_recall
    - citation_f1
    - useful_english_citation_ratio
    - answer_faithfulness

output:
  runs_dir: output/citation_runs
  analysis_dir: output/citation_analysis
