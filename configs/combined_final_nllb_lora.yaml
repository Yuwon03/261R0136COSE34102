experiment:
  name: combined-final-nllb-lora
  task_type: training
  seed: 13

data:
  dataset_path: data/combined_ko_train.jsonl
  corpus_path: data/wiki_en_corpus_300k.jsonl
  split: train

model:
  base_model: facebook/nllb-200-distilled-1.3B
  checkpoint_dir: output/checkpoints_nllb_lora/supervised
  max_input_length: 256
  max_output_length: 64
  use_mock_model_for_smoke: false
  src_lang: kor_Hang
  tgt_lang: eng_Latn
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - v_proj

training:
  epochs: 8
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  retrieval_loss_weight: 0.5
  fp16: true
  gradient_checkpointing: true
  save_each_epoch: true
  output_dir: output/checkpoints_nllb_lora

retriever:
  backend: bm25
  top_k: 10

evaluation:
  top_k: 10
  metrics:
    - recall_at_k
    - mrr
    - ndcg
    - source_diversity
    - source_language_ratio
    - faithfulness

output:
  runs_dir: output/final_runs
  analysis_dir: output/final_analysis_nllb_lora
