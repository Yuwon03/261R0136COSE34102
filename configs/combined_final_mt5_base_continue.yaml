experiment:
  name: combined-final-mt5-base-continued
  task_type: training
  seed: 13

data:
  dataset_path: data/combined_ko_train.jsonl
  corpus_path: data/wiki_en_corpus_300k.jsonl
  split: train

model:
  base_model: output/checkpoints_mt5_base/supervised
  checkpoint_dir: output/checkpoints_mt5_base_continued/supervised
  max_input_length: 256
  max_output_length: 64
  use_mock_model_for_smoke: false

training:
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.00005
  retrieval_loss_weight: 0.5
  fp16: false
  gradient_checkpointing: true
  output_dir: output/checkpoints_mt5_base_continued

retriever:
  backend: bm25
  top_k: 10

evaluation:
  top_k: 10
  metrics:
    - recall_at_k
    - mrr
    - ndcg
    - source_diversity
    - source_language_ratio
    - faithfulness

output:
  runs_dir: output/final_runs
  analysis_dir: output/final_analysis_mt5_base_continued
