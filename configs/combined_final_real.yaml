experiment:
  name: combined-final-real
  task_type: training
  seed: 13

data:
  dataset_path: data/combined_ko_train.jsonl
  corpus_path: data/wiki_en_corpus_300k.jsonl
  split: train

model:
  base_model: google/mt5-small
  checkpoint_dir: output/checkpoints/supervised
  max_input_length: 256
  max_output_length: 64
  use_mock_model_for_smoke: false

training:
  epochs: 3
  batch_size: 4
  learning_rate: 0.0002
  retrieval_loss_weight: 0.5
  output_dir: output/checkpoints

retriever:
  backend: bm25
  top_k: 10

evaluation:
  top_k: 10
  metrics:
    - recall_at_k
    - mrr
    - ndcg
    - source_diversity
    - source_language_ratio
    - faithfulness

output:
  runs_dir: output/final_runs
  analysis_dir: output/final_analysis
